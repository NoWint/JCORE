<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Attention reproduction agreement</title>
  <desc id="desc">A heatmap showing high agreement between reproduction and reference attention outputs.</desc>
  <rect width="640" height="360" fill="#ffffff" />
  <text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#111111">Attention Output Agreement</text>
  <g transform="translate(48 64)">
    <g>
      <rect x="0" y="0" width="260" height="220" fill="#e8e4da" />
      <rect x="0" y="0" width="260" height="220" fill="none" stroke="#111111" />
      <line x1="0" y1="0" x2="260" y2="220" stroke="#8a6a3b" stroke-width="2" />
      <line x1="260" y1="0" x2="0" y2="220" stroke="#8a6a3b" stroke-width="2" />
      <text x="130" y="248" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">Reference</text>
      <text x="-110" y="-18" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle" transform="rotate(-90)">Reproduction</text>
    </g>
    <g transform="translate(320 0)">
      <rect x="0" y="0" width="260" height="220" fill="#f5f1e8" />
      <rect x="0" y="0" width="260" height="220" fill="none" stroke="#111111" />
      <line x1="0" y1="220" x2="260" y2="0" stroke="#7a6a4a" stroke-width="3" />
      <circle cx="130" cy="110" r="5" fill="#8a6a3b" />
      <text x="130" y="248" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">Reproduction</text>
    </g>
  </g>
  <text x="24" y="330" font-family="Arial, sans-serif" font-size="12" fill="#555555">Demonstration figure for JCORE.</text>
</svg>
